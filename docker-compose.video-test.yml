services:
  app:
    build:
      context: .
    image: trek-video-test:local
    container_name: trek-video-test

    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    tmpfs:
      - /tmp:noexec,nosuid,size=128m

    ports:
      - "3001:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - TZ=${TZ:-Europe/Paris}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}

      # Important pour Immich local
      - ALLOW_INTERNAL_NETWORK=true

    volumes:
      - ./data-test:/app/data
      - ./uploads-test:/app/uploads

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
