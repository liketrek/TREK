<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TREK 中国版 MVP 开发看板</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6feb;
    --done: #1f9d55;
    --doing: #d97706;
    --todo: #6b7280;
    --backlog: #8b5cf6;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding: 22px 28px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .2px; }
  .sub { margin: 0; color: var(--muted); font-size: 12.5px; }
  .progress-wrap { min-width: 260px; }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress {
    height: 8px;
    background: #e9edf2;
    border-radius: 99px;
    overflow: hidden;
  }
  .progress > div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #2f6feb, #4f8ef7);
    border-radius: 99px;
    transition: width .25s ease;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    padding: 12px 28px;
    align-items: center;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(244, 245, 247, .92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .toolbar input, .toolbar select {
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    outline: none;
  }
  .toolbar input { flex: 1 1 260px; max-width: 420px; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
  .toolbar button {
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .toolbar button:hover { color: #b91c1c; border-color: #fca5a5; }
  .spacer { flex: 1; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(260px, 1fr));
    gap: 16px;
    padding: 18px 28px 40px;
    align-items: start;
  }
  .column {
    background: #eceff3;
    border: 1px solid #e3e7ec;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    max-height: calc(100vh - 170px);
  }
  .column-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px 8px;
    font-weight: 600;
    font-size: 13px;
  }
  .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--todo); }
  .column[data-status="doing"] .dot { background: var(--doing); }
  .column[data-status="done"] .dot { background: var(--done); }
  .column[data-status="backlog"] .dot { background: var(--backlog); }
  .count {
    margin-left: auto;
    font-weight: 500;
    color: var(--muted);
    font-size: 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 0 8px;
  }
  .cards {
    padding: 6px 10px 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .cards.dragover { background: #e3edff; border-radius: 0 0 12px 12px; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 10px 9px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 8px;
    cursor: grab;
    position: relative;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #c7d2fe; }
  .card.dragging { opacity: .45; }
  .card.done { background: #f7fbf8; }
  .card.done .card-title { color: var(--muted); text-decoration: line-through; text-decoration-color: #9ca3af; }
  .check { flex: 0 0 auto; padding-top: 1px; }
  .check input { width: 15px; height: 15px; accent-color: var(--done); cursor: pointer; }
  .card-main { min-width: 0; flex: 1; }
  .card-title { font-size: 13px; font-weight: 600; line-height: 1.35; word-break: break-word; }
  .id {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    margin-right: 4px;
  }
  .card-desc { margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.45; word-break: break-word; }
  .card-meta { margin-top: 7px; display: flex; gap: 5px; flex-wrap: wrap; }
  .badge {
    font-size: 10.5px;
    line-height: 18px;
    padding: 0 7px;
    border-radius: 99px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .ms { background: #f3f4f6; color: #4b5563; border-color: #e5e7eb; }
  .g-cmp { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .g-map { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .g-plan { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .g-shr { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
  .g-fe { background: #fdf2f8; color: #be185d; border-color: #fbcfe8; }
  .g-col { background: #f0fdfa; color: #0f766e; border-color: #99f6e4; }
  .g-ops { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .g-qat { background: #f8fafc; color: #334155; border-color: #e2e8f0; }
  .g-beta { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; }
  .g-post { background: #faf5ff; color: #7e22ce; border-color: #e9d5ff; }
  .card-actions {
    position: absolute;
    right: 8px;
    bottom: 7px;
    display: none;
    gap: 4px;
  }
  .card:hover .card-actions, .card:focus-within .card-actions { display: flex; }
  .card-actions button {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--muted);
    font-size: 11px;
    border-radius: 6px;
    padding: 1px 6px;
    cursor: pointer;
  }
  .card-actions button:hover { color: var(--accent); border-color: #bfdbfe; }
  .empty {
    color: #9ca3af;
    font-size: 12px;
    text-align: center;
    padding: 26px 8px;
  }
  .foot {
    padding: 0 28px 26px;
    color: var(--muted);
    font-size: 12px;
  }
  .foot code { background: #e9edf2; padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 1180px) {
    .board { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
    .column { max-height: none; }
  }
  @media (max-width: 700px) {
    .topbar, .toolbar, .board, .foot { padding-left: 14px; padding-right: 14px; }
    .board { grid-template-columns: 1fr; }
    .toolbar input { max-width: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div>
    <h1>TREK 中国版 MVP 开发看板</h1>
    <p class="sub">62 项任务 · 6 个里程碑 · 勾选即完成，进度保存在本机浏览器</p>
  </div>

</header>

  <select id="milestoneFilter" aria-label="按里程碑筛选"></select>
  <span class="spacer"></span>
  <button id="resetBtn" type="button">重置进度</button>
</div>

<main class="board">
  <section class="column" data-status="todo">

    <div class="cards" id="col-todo" data-status="todo"></div>
  </section>
  <section class="column" data-status="doing">

    <div class="cards" id="col-doing" data-status="doing"></div>
  </section>
  <section class="column" data-status="done">
    <div class="column-head"><span class="dot"></span>已完成<span class="count" id="count-done">0</span></div>
    <div class="cards" id="col-done" data-status="done"></div>
  </section>
  <section class="column" data-status="backlog">
    <div class="column-head"><span class="dot"></span>超出 MVP<span class="count" id="count-backlog">0</span></div>
    <div class="cards" id="col-backlog" data-status="backlog"></div>
  </section>
</main>

<div class="foot">
  数据来源：<code>docs/TREK中国版MVP开发任务清单.md</code>。完成度按 55 项 MVP 任务计算，超出 MVP 的 7 项不计入分母。状态仅保存在当前浏览器的 <code>localStorage</code>。
</div>

const STATUSES = ['todo', 'doing', 'done', 'backlog'];
const COLUMNS = {
  todo: document.getElementById('col-todo'),
  doing: document.getElementById('col-doing'),
  done: document.getElementById('col-done'),
  backlog: document.getElementById('col-backlog')
};

function defaultStatus(task) {
  return task.group === 'POST' ? 'backlog' : 'todo';
}

function loadState() {
  const base = {};
  TASKS.forEach(t => { base[t.id] = defaultStatus(t); });
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    TASKS.forEach(t => {
      if (STATUSES.includes(saved[t.id])) base[t.id] = saved[t.id];
    });
  } catch (e) { /* ignore broken storage */ }
  return base;
}

let state = loadState();
let filters = { search: '', group: 'all', milestone: 'all' };

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function matches(task) {
  if (filters.group !== 'all' && task.group !== filters.group) return false;
  if (filters.milestone !== 'all' && task.milestone !== filters.milestone) return false;
  if (!filters.search) return true;
  const q = filters.search.toLowerCase();
  return (task.id + ' ' + task.title + ' ' + task.desc).toLowerCase().includes(q);
}

function cardEl(task) {
  const el = document.createElement('article');
  el.className = 'card' + (state[task.id] === 'done' ? ' done' : '');
  el.draggable = true;
  el.dataset.id = task.id;

  const check = document.createElement('div');
  check.className = 'check';
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.checked = state[task.id] === 'done';
  input.setAttribute('aria-label', task.id + ' ' + task.title);
  input.addEventListener('change', () => {
    state[task.id] = input.checked ? 'done' : (task.group === 'POST' ? 'backlog' : 'todo');
    saveState();
    render();
  });
  check.appendChild(input);

  const main = document.createElement('div');
  main.className = 'card-main';
  const title = document.createElement('div');
  title.className = 'card-title';
  const id = document.createElement('span');
  id.className = 'id';
  id.textContent = task.id;
  title.appendChild(id);
  title.appendChild(document.createTextNode(task.title));

  const desc = document.createElement('div');
  desc.className = 'card-desc';
  desc.textContent = task.desc;

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  const g = GROUPS[task.group];
  const gb = document.createElement('span');
  gb.className = 'badge ' + g.cls;
  gb.textContent = g.name;
  const mb = document.createElement('span');
  mb.className = 'badge ms';
  mb.textContent = task.milestone;
  meta.appendChild(gb);
  meta.appendChild(mb);

  main.appendChild(title);
  main.appendChild(desc);
  main.appendChild(meta);

  const actions = document.createElement('div');
  actions.className = 'card-actions';
  const status = state[task.id];
  if (status === 'todo' || status === 'backlog') {
    actions.appendChild(actionButton('开始', () => setStatus(task.id, 'doing')));
  }
  if (status === 'doing') {
    actions.appendChild(actionButton('完成', () => setStatus(task.id, 'done')));
    actions.appendChild(actionButton('退回', () => setStatus(task.id, defaultStatus(task))));
  }
  if (status === 'done') {
    actions.appendChild(actionButton('退回', () => setStatus(task.id, defaultStatus(task))));
  }

  el.appendChild(check);
  el.appendChild(main);
  el.appendChild(actions);

  el.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', task.id);
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));

  return el;
}

function actionButton(label, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

function setStatus(id, status) {
  state[id] = status;
  saveState();
  render();
}

function render() {
  STATUSES.forEach(s => { COLUMNS[s].innerHTML = ''; });

  const visible = TASKS.filter(matches);
  const byStatus = { todo: [], doing: [], done: [], backlog: [] };
  visible.forEach(t => byStatus[state[t.id]].push(t));

  STATUSES.forEach(s => {
    const list = byStatus[s];
    document.getElementById('count-' + s).textContent = list.length;
    if (list.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '暂无任务';
      COLUMNS[s].appendChild(empty);
      return;
    }
    list.forEach(t => COLUMNS[s].appendChild(cardEl(t)));
  });

  const mvp = TASKS.filter(t => t.group !== 'POST');
  const done = mvp.filter(t => state[t.id] === 'done').length;
  const pct = mvp.length ? Math.round((done / mvp.length) * 100) : 0;
  document.getElementById('progressText').textContent = done + ' / ' + mvp.length;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
}

function setupDropZones() {
  STATUSES.forEach(s => {
    const zone = COLUMNS[s];
    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      if (!id || !state.hasOwnProperty(id)) return;
      state[id] = s;
      saveState();
      render();
    });
  });
}

function setupFilters() {
  const groupSelect = document.getElementById('groupFilter');
  groupSelect.innerHTML = '<option value="all">全部分组</option>' +
    Object.entries(GROUPS).map(([k, v]) => '<option value="' + k + '">' + v.name + '</option>').join('');

  const msSelect = document.getElementById('milestoneFilter');
  msSelect.innerHTML = '<option value="all">全部里程碑</option>' +
    Object.entries(MILESTONES).map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('');

  document.getElementById('search').addEventListener('input', (e) => {
    filters.search = e.target.value.trim();
    render();
  });
  groupSelect.addEventListener('change', (e) => {
    filters.group = e.target.value;
    render();
  });
  msSelect.addEventListener('change', (e) => {
    filters.milestone = e.target.value;
    render();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!confirm('确定重置全部任务状态吗？')) return;
    state = {};
    TASKS.forEach(t => { state[t.id] = defaultStatus(t); });
    saveState();
    render();
  });
}

setupFilters();
setupDropZones();
render();
</script>
</body>
</html>
